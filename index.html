  <style>
    body {
      min-height: max(884px, 100dvh);
    }
    .fade-in {
      animation: fadeIn 1.5s ease-in-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .progress-bar-animation {
        animation: progressBar 2s ease-in-out forwards;
    }
    @keyframes progressBar {
        from { width: 0%; }
        to { width: 100%; }
    }
    .material-symbols-outlined {
      font-variation-settings:
        'FILL' 0,
        'wght' 400,
        'GRAD' 0,
        'opsz' 24
    }
  </style>
